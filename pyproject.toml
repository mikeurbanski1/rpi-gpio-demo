[project]
name = "gpio-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Urbanski", email = "mikeurbanski1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adafruit-lgpio>=0.2.2.0 ; (python_full_version >= '3.13' and platform_machine == 'aarch64' and sys_platform == 'linux') or (python_full_version >= '3.13' and platform_machine == 'armv7l' and sys_platform == 'linux')",
    "gpiozero>=2.0.1.post3",
]

[project.scripts]
gpio-demo = "gpio_demo:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
